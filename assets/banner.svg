<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Animated Glow Filters -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.7; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes pulseWave {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.3; }
      50% { stroke-dashoffset: 40; opacity: 0.6; }
    }
    @keyframes pingDot {
      0%, 100% { r: 4px; opacity: 0.4; }
      50% { r: 6.5px; opacity: 1; }
    }
    .orb-left {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 150px;
    }
    .orb-right {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 250px;
    }
    .floating-card-1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .wave-line {
      stroke-dasharray: 8 8;
      animation: pulseWave 12s linear infinite;
    }
    .dot-ping {
      animation: pingDot 3s ease-in-out infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Glowing Ambient Orbs (Background layer) -->
  <circle class="orb-left" cx="220" cy="130" r="140" fill="url(#glow-teal)" filter="url(#blur-glow)" />
  <circle class="orb-right" cx="980" cy="270" r="160" fill="url(#glow-purple)" filter="url(#blur-glow)" />

  <!-- Dynamic Circuit / Wave Connections (Background) -->
  <path class="wave-line" d="M 60 210 Q 300 90 600 210 T 1140 210" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <path class="wave-line" d="M 60 250 Q 350 370 600 250 T 1140 250" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3"/>

  <!-- Interactive Dynamic Floating Cards / Pills (Carefully placed so title/subtitle are untouched) -->
  <!-- Top Left Pill -->
  <g class="floating-card-1" transform="translate(60, 45)">
    <rect width="170" height="38" rx="19" fill="#1e293b" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.2"/>
    <circle class="dot-ping" cx="24" cy="19" r="5" fill="#10b981" />
    <text x="38" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 Agentic Workflows</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-card-2" transform="translate(970, 45)">
    <rect width="170" height="38" rx="19" fill="#1e293b" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.2"/>
    <circle class="dot-ping" cx="24" cy="19" r="5" fill="#38bdf8" />
    <text x="38" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 Self-Host &amp; Scale</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-card-2" transform="translate(60, 340)">
    <rect width="190" height="38" rx="19" fill="#1e293b" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.2"/>
    <circle class="dot-ping" cx="24" cy="19" r="5" fill="#f59e0b" />
    <text x="38" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Autonomous Engines</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-card-1" transform="translate(950, 340)">
    <rect width="190" height="38" rx="19" fill="#1e293b" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.2"/>
    <circle class="dot-ping" cx="24" cy="19" r="5" fill="#ec4899" />
    <text x="38" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎯 Predictive Delivery</text>
  </g>

  <!-- High-Contrast Crisp Foreground: Title, Subtitle, & Tagline -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Small Category Tag -->
    <rect x="-140" y="95" width="280" height="28" rx="14" fill="#312e81" fill-opacity="0.9" stroke="#6366f1" stroke-width="1"/>
    <text x="0" y="114" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="175" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Autonomous Campaign Management
    </text>

    <!-- Subtitle (Always in foreground and prominently visible) -->
    <text x="0" y="222" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" opacity="0.95">
      Commercial AI Campaign Platforms ⚡ Self-Hosted Marketing Automation Engines
    </text>

    <!-- Explanatory Meta Line -->
    <text x="0" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Multi-Agent Orchestration • Autonomous Lead Hunting • Real-Time Language Optimization • Omnichannel Nurturing
    </text>

    <!-- Interactive Badges row inside banner -->
    <g transform="translate(0, 288)">
      <rect x="-195" y="0" width="120" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="-135" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🚀 Enterprise AI</text>

      <rect x="-65" y="0" width="130" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="17" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔓 Open-Source</text>

      <rect x="75" y="0" width="120" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="135" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 AI Agents</text>
    </g>
  </g>
</svg>
